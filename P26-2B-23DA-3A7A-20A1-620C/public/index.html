<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memória Código ↔ Saída · P26-2B-23DA-3A7A-20A1-620C</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">Memória Código ↔ Saída</div>
      <div class="user-area" id="userArea"></div>
    </div>
  </header>

  <main>
    <section id="loggedOut" class="panel center" hidden>
      <h1>Jogo da Memória: Código ↔ Saída</h1>
      <p>Encontre os pares: cada trecho de código combina com a saída que ele produz.</p>
      <a class="btn" href="/api/auth/discord">Entrar com Discord</a>
      <p id="authMessage" class="message" role="alert"></p>
    </section>

    <section id="gameArea" hidden>
      <div class="stats">
        <div class="stat"><span class="stat-label">Movimentos</span><span class="stat-value" id="moves">0</span></div>
        <div class="stat"><span class="stat-label">Pares</span><span class="stat-value" id="pairs">0/0</span></div>
        <div class="stat"><span class="stat-label">Tempo</span><span class="stat-value" id="time">00:00</span></div>
        <button class="btn" id="newGameBtn" type="button">Nova partida</button>
      </div>

      <p id="message" class="message" role="status" aria-live="polite"></p>
      <div id="board" class="board" aria-label="Tabuleiro de cartas"></div>
    </section>
  </main>

  <footer id="projectFooter">
    Chave Única de Auditoria: <code>P26-2B-23DA-3A7A-20A1-620C</code> · Turma 2B · Licença MIT
  </footer>

  <script src="/app.js"></script>
</body>
</html>
